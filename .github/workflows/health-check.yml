name: InfinityFree Domains Health Check & Catalog Sync

on:
  schedule:
    - cron: '0 6 * * *' # Every day at 06:00 UTC
  workflow_dispatch:
  push:
    paths:
      - 'config/domains.json'
      - '.github/workflows/health-check.yml'

jobs:
  check-domains:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests tabulate python-dotenv urllib3

      - name: Validate Catalog JSON
        run: |
          python3 -c "import json; json.load(open('config/domains.json'))"

      - name: Run Domain Health Check & Update DOMAINS.md
        run: |
          python3 -m agent.cli health-check --sync

      - name: Commit and Push Updated DOMAINS.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DOMAINS.md
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-Update: InfinityFree Domain Health Matrix [skip ci]"
            git push
          else
            echo "No changes to DOMAINS.md"
          fi
